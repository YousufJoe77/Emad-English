
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dashboard | Emad English</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,sans-serif}
.top{background:#fff;border-bottom:1px solid #e5eaf3;padding:18px 5%}
.logo{font-size:22px;font-weight:800}
.logo span{color:#536dfe}
.main{max-width:1100px;margin:34px auto;padding:0 20px}
.eyebrow{color:#536dfe;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
h1{font-size:34px;letter-spacing:-1px;margin:8px 0}
p{color:#6b768a;line-height:1.6}
.panel{background:#fff;border:1px solid #e5eaf3;border-radius:16px;overflow:hidden;margin-top:22px}
.panel-head{padding:18px 20px;border-bottom:1px solid #e5eaf3;display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel-head h2{font-size:17px;margin:0}
button,.download{border:0;border-radius:9px;background:#536dfe;color:white;padding:10px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input{width:100%;padding:12px;border:1px solid #d5dceb;border-radius:9px;font-size:16px;margin:8px 0 12px}
.login{max-width:420px;padding:22px}
.login label{font-weight:700;font-size:14px}
.stats{margin:22px 0}
.pill{display:inline-block;background:#fff;border:1px solid #e5eaf3;border-radius:12px;padding:12px 16px;font-weight:700}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:15px 20px;border-bottom:1px solid #edf0f6;font-size:13px}
th{color:#718096;background:#fafbfe;font-size:11px;text-transform:uppercase;letter-spacing:.7px}
td{overflow-wrap:anywhere}
.empty{padding:30px;color:#718096;text-align:center}
.download{display:inline-block;padding:8px 11px;font-size:12px;text-decoration:none;white-space:nowrap}
#message{padding:12px 0;color:#b42318;font-size:13px;overflow-wrap:anywhere}
.hidden{display:none!important}
@media(max-width:600px){h1{font-size:27px}.main{margin:24px auto}.panel-head{padding:14px}th,td{padding:12px}}
</style>
</head>

<body>
<header class="top">
  <div class="logo">EMAD<span>.</span> ENGLISH</div>
</header>

<main class="main">
  <div class="eyebrow">Teacher portal</div>
  <h1>Homework submissions</h1>
  <p>Sign in with the teacher password to review and download homework.</p>

  <section class="panel login" id="loginPanel">
    <form id="loginForm">
      <label for="password">Teacher password</label>
      <input id="password" type="password" autocomplete="current-password"
             placeholder="Enter teacher password" required>
      <button id="loginButton" type="submit">Open Dashboard</button>
    </form>
  </section>

  <div id="dashboard" class="hidden">
    <div class="stats">
      <div class="pill">Submissions: <span id="count">0</span></div>
    </div>

    <div id="message" role="status"></div>

    <section class="panel">
      <div class="panel-head">
        <h2>Recent submissions</h2>
        <button id="refresh">Refresh</button>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Stage</th>
              <th>File</th>
              <th>Submitted</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="empty">Enter the teacher password.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
const FUNCTION_URL =
  "https://qwljyziwookssiuxahfr.supabase.co/functions/v1/teacher-homework";

const loginPanel = document.getElementById("loginPanel");
const loginForm = document.getElementById("loginForm");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const rows = document.getElementById("rows");
const count = document.getElementById("count");
const refreshButton = document.getElementById("refresh");

let teacherPassword = "";

function showMessage(text, isError = true) {
  message.textContent = text;
  message.style.color = isError ? "#b42318" : "#18794e";
}

async function loadSubmissions() {
  refreshButton.disabled = true;
  refreshButton.textContent = "Loading...";
  showMessage("");

  rows.replaceChildren();
  const loadingRow = document.createElement("tr");
  const loadingCell = document.createElement("td");
  loadingCell.colSpan = 5;
  loadingCell.className = "empty";
  loadingCell.textContent = "Loading submissions...";
  loadingRow.appendChild(loadingCell);
  rows.appendChild(loadingRow);

  try {
    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: teacherPassword })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Could not load submissions.");
    }

    const submissions = result.submissions || [];
    count.textContent = submissions.length;
    rows.replaceChildren();

    if (submissions.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 5;
      td.className = "empty";
      td.textContent = "No homework has been submitted yet.";
      tr.appendChild(td);
      rows.appendChild(tr);
      return;
    }

    for (const item of submissions) {
      const files = item.files || [];
      const file = files[0] || null;
      const tr = document.createElement("tr");

      const values = [
        item.student_name || "—",
        item.stage || "—",
        file ? file.original_name : "No file",
        item.submitted_at
          ? new Date(item.submitted_at).toLocaleString()
          : "—"
      ];

      for (const value of values) {
        const td = document.createElement("td");
        td.textContent = value;
        tr.appendChild(td);
      }

      const action = document.createElement("td");

      if (file && file.download_url) {
        const link = document.createElement("a");
        link.className = "download";
        link.textContent = "Download";
        link.href = file.download_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        action.appendChild(link);
      } else if (file) {
        action.textContent = "Download unavailable";
      } else {
        action.textContent = "—";
      }

      tr.appendChild(action);
      rows.appendChild(tr);
    }

    showMessage("Submissions loaded successfully.", false);
  } catch (error) {
    rows.replaceChildren();
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5;
    td.className = "empty";
    td.textContent = "Could not load submissions.";
    tr.appendChild(td);
    rows.appendChild(tr);

    showMessage("Error: " + (error.message || "Unknown error"));

    if (error.message === "Incorrect teacher password.") {
      teacherPassword = "";
      loginPanel.classList.remove("hidden");
      dashboard.classList.add("hidden");
      passwordInput.value = "";
      passwordInput.focus();
    }
  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = "Refresh";
  }
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  teacherPassword = passwordInput.value;

  loginButton.disabled = true;
  loginButton.textContent = "Checking...";
  dashboard.classList.remove("hidden");

  await loadSubmissions();

  if (teacherPassword) {
    loginPanel.classList.add("hidden");
  }

  loginButton.disabled = false;
  loginButton.textContent = "Open Dashboard";
});

refreshButton.addEventListener("click", loadSubmissions);
</script>
</body>
</html>

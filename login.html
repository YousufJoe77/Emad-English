<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Login | Emad English</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f3f6fb;color:#172033;font-family:Inter,Arial,sans-serif}.card{width:min(100%,420px);background:#fff;border:1px solid #e3e8f2;border-radius:20px;padding:32px;box-shadow:0 18px 60px #1c2a4410}.logo{font-size:23px;font-weight:800}.logo span{color:#536dfe}.eyebrow{margin-top:28px;color:#536dfe;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}h1{margin:8px 0;font-size:30px;letter-spacing:-1px}p{color:#68748a;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #dce3ef;border-radius:10px;font:inherit}button{width:100%;margin-top:22px;border:0;border-radius:10px;padding:14px;background:#536dfe;color:white;font-weight:700;cursor:pointer}#status{margin-top:15px;font-size:13px;color:#b42318;overflow-wrap:anywhere}a{color:#536dfe}
</style>
</head>
<body><main class="card"><div class="logo">EMAD<span>.</span> ENGLISH</div><div class="eyebrow">Teacher access</div><h1>Welcome back.</h1><p>Sign in with the teacher account created in Supabase Authentication.</p>
<form id="loginForm"><label for="email">Teacher email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">Sign in</button></form><div id="status" role="status"></div></main>
<script>
const db = window.supabase.createClient("https://qwljyziwookssiuxahfr.supabase.co","sb_publishable_UEnx7UzAp3l2lCTXRqRmQg_ZolHqMGU");
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("loginBtn"),s=document.getElementById("status");b.disabled=true;b.textContent="Signing in...";s.textContent="";
const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
if(error){s.textContent="Sign-in failed: "+error.message;b.disabled=false;b.textContent="Sign in";return;}
location.href="dashboard.html";
});
</script></body></html>
